name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    if: github.event.created
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Expected version tag v$version, received $env:GITHUB_REF_NAME"
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:win -- --publish never
      - name: Run Electron tests against the build
        run: node scripts/checkDesktop.mjs

      - name: Prepare release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          foreach ($name in "Inventory Setup $env:VERSION.exe", "Inventory $env:VERSION.exe") {
            $file = Get-Item -LiteralPath (Join-Path release $name) -ErrorAction Stop
            if ($file.Length -eq 0) { throw "Empty release file: $name" }
            Rename-Item -LiteralPath $file.FullName -NewName $name.Replace(' ', '-')
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-windows-x64
          path: |
            release/Inventory-Setup-${{ steps.version.outputs.number }}.exe
            release/Inventory-${{ steps.version.outputs.number }}.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inventory-windows-x64
          path: release

      - name: Attach installer and portable app
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=("release/Inventory-Setup-$version.exe" "release/Inventory-$version.exe")
          for asset in "${assets[@]}"; do test -s "$asset"; done
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.size > 0) | .name')
            for asset in "${assets[@]}"; do
              grep -Fxq -- "${asset##*/}" <<< "$uploaded" || { echo "Published release is missing ${asset##*/}"; exit 1; }
            done
            exit 0
          fi
          # A failed asset upload can leave a draft. Finish that draft on retry.
          if [[ "$draft" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --title "Inventory $version" "${flags[@]}" "${assets[@]}"
          fi
