name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · сборка и тесты
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Проверить состав репозитория
        run: npm run check:files

      - name: Установить зависимости
        run: npm ci --no-audit

      - name: Проверить зависимости
        run: npm audit

      - name: Проверить логику приложения и SQLite
        run: npm test

      - name: Собрать приложение и проверить интерфейс Electron
        run: npm run test:desktop

      - name: Собрать приложение x86 на Electron 22
        run: npm run build:win7 -- --dir --publish never

      - name: Проверить упакованное приложение x86
        run: npm run test:win7
